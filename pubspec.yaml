name: together_date_planner
description: A private date planning app for two partners.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  timezone: ^0.10.1
  pdfrx: ^2.6.5
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  image: ^4.12.0
  http: ^1.6.0
  super_clipboard: ^0.1.7+6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # Upstream 0.1.1 omits the namespace required by current Android Gradle Plugin.
  irondash_engine_context:
    path: third_party/irondash_engine_context
  # Fix upstream CargoKit traversal of Gradle's childProjects map entries.
  super_native_extensions:
    path: third_party/super_native_extensions

flutter:
  generate: true
  uses-material-design: true
